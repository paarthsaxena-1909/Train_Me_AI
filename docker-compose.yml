services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trainme
      POSTGRES_USER: trainme
      POSTGRES_PASSWORD: trainme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainme -d trainme"]
      interval: 5s
      timeout: 5s
      retries: 10

  database-migration:
    build:
      context: ./backend
      dockerfile: database/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/database/.env
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/app/.env
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      database-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
