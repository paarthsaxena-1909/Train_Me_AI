services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trainme
      POSTGRES_USER: trainme
      POSTGRES_PASSWORD: trainme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainme -d trainme"]
      interval: 5s
      timeout: 5s
      retries: 10

  database-migration:
    build:
      context: ./backend
      dockerfile: database/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://trainme:trainme@postgres:5432/trainme
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://trainme:trainme@postgres:5432/trainme
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/data/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      database-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
